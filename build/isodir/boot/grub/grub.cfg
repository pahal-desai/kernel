insmod font
insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu

if loadfont /boot/grub/themes/kernos/sans.pf2 ; then
    set gfxmode=auto
    terminal_output gfxterm
    set theme=/boot/grub/themes/kernos/theme.txt
fi

set timeout=5
set default=0

menuentry "KernOS" {
    multiboot /boot/kernel.bin
    boot
}